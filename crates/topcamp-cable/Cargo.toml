[package]
name = "topcamp-cable"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = { version = "0.22" }
hmac = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10" }
serde_json = { version = "1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
