[package]
name = "topcamp-web"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
topcamp-cable = { path = "../topcamp-cable" }
topcamp-db = { path = "../topcamp-db" }
topcamp-domain = { path = "../topcamp-domain" }
topcamp-storage = { path = "../topcamp-storage" }
topcoat = { version = "0.9", features = ["multipart", "runtime", "ui", "websocket"] }
# Test-only asset self-bundling (`lib.rs::self_bundle_for_tests`): asset
# ids embed the build OUT_DIR, which varies with feature unification, so
# test binaries bundle themselves at runtime. Never activated in prod.
topcoat-asset = { version = "0.9", features = ["bundler"] }
# `time` (beat ticker) + `sync` (broadcast/mpsc fan-in) are already in the
# unified set via dbos/cable — listing them only documents the use.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Main (not dev): the serve binary LISTENs for worker NOTIFYs.
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio"] }
tracing = { version = "0.1" }
http = { version = "1" }
bcrypt = { version = "0.17" }
rand = { version = "0.9" }
subtle = { version = "2" }
# ActiveStorage blob identity: base36 key + base64(md5) checksum.
md5 = { version = "0.8" }
base64 = { version = "0.22" }
# Signed avatar tokens: HMAC-SHA256 over the user id.
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
# Permanent `last_room` cookie expiry (20 years, like upstream).
time = { version = "0.3" }
# Bracketed form keys (`room[name]`, `user_ids[]`) parsed as raw pairs.
serde_urlencoded = { version = "0.7" }
# Dual content-type updates (`PATCH /account` takes urlencoded settings
# or a multipart logo file); same multer topcoat-router already uses.
multer = { version = "3.1" }
futures-util = { version = "0.3" }
bytes = { version = "1" }
# Logo/avatar variants (PNG/JPEG decode, PNG + WebP encode only).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Link unfurling (`POST /unfurl_link`): fetch + redirect hop
# validation reuse topcamp-workflows' reqwest/url (already locked).
# gzip/deflate inflate compressed pages, like Net::HTTP does.
reqwest = { version = "0.12", features = ["gzip", "deflate"] }
url = { version = "2" }
# Rails `signed_id` password-key derivation (0.12 pairs with the
# sha2 0.10 / hmac 0.12 above; 0.13 wants digest 0.11).
pbkdf2 = { version = "0.12", features = ["hmac"] }
# Hex HMAC digests in `signed_id` tokens.
hex = { version = "0.4" }

[dev-dependencies]
# Live cable tests: real TCP server + real WS client (both already in the
# lockfile via topcoat's own stack).
futures-util = { version = "0.3" }
tokio-tungstenite = { version = "0.29" }
